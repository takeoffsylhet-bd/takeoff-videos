<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8">
<style>
@font-face{font-family:HS;src:url(fonts/hind-siliguri-bengali-700-normal.woff2);font-weight:700}
@font-face{font-family:HS;src:url(fonts/hind-siliguri-bengali-600-normal.woff2);font-weight:600}
@font-face{font-family:NB;src:url(fonts/noto-sans-bengali-bengali-800-normal.woff2);font-weight:800}
*{margin:0;padding:0;box-sizing:border-box}
html,body{overflow:hidden}
body{font-family:HS,NB,sans-serif;color:#fff;background:#06291a;position:relative}
body.v{width:1080px;height:1920px} body.h{width:1920px;height:1080px}
.bg{position:absolute;inset:0;background:radial-gradient(circle at 30% 20%,#14824a 0%,#0a4a2b 45%,#041c10 100%)}
.grid{position:absolute;inset:-100px 0 0 0;opacity:.08;background-image:linear-gradient(#fff 2px,transparent 2px),linear-gradient(90deg,#fff 2px,transparent 2px);background-size:90px 90px;animation:drift 8s linear forwards}
@keyframes drift{to{transform:translateY(90px)}}
.plane{position:absolute;font-size:120px;opacity:.15;top:260px;left:-200px;animation:fly 9s linear forwards}
@keyframes fly{to{transform:translateX(2300px) translateY(-200px)}}
.brand{position:absolute;display:flex;align-items:center;gap:22px}
.v .brand{top:90px;left:0;right:0;justify-content:center}
.h .brand{top:44px;left:60px}
.logo{width:110px;height:110px;border-radius:50%;border:4px solid #fff;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.h .logo{width:90px;height:90px}
.bname{font:700 44px Arial,sans-serif;letter-spacing:1px}
.h .bname{font-size:36px}
.bname small{display:block;font-size:28px;font-weight:400;opacity:.85;letter-spacing:3px}
.h .bname small{font-size:22px}
.foot{position:absolute;text-align:center;font:600 34px Arial,sans-serif;opacity:.8;letter-spacing:4px}
.v .foot{bottom:110px;left:0;right:0}
.h .foot{top:70px;right:60px;font-size:30px}
.center{position:absolute;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.v .center{left:70px;right:70px;top:360px;bottom:300px}
.h .center{left:110px;right:110px;top:170px;bottom:60px}
.warn{display:inline-block;background:#e63b2e;color:#fff;font-weight:700;font-size:62px;padding:14px 48px;border-radius:60px;margin-bottom:56px}
.h .warn{font-size:48px;margin-bottom:40px}
.h1{font-weight:700;font-size:104px;line-height:1.4}
.h .h1{font-size:120px}
.y{color:#ffd23f}
.sub{font-weight:600;font-size:52px;opacity:.9;margin-top:40px;line-height:1.5}
.h .sub{font-size:54px;margin-top:28px}
.num{width:230px;height:230px;border-radius:50%;background:#ffd23f;color:#063a20;font-family:NB;font-weight:800;font-size:150px;line-height:236px;margin-bottom:70px;box-shadow:0 0 0 18px rgba(255,210,63,.25);flex:none}
.label{font-size:50px;font-weight:600;opacity:.85;margin-bottom:44px;letter-spacing:2px}
.title{font-weight:700;font-size:90px;line-height:1.5;margin-bottom:56px}
.desc{font-weight:600;font-size:54px;line-height:1.5;background:rgba(0,0,0,.28);border-left:12px solid #ffd23f;padding:34px 40px;border-radius:18px;text-align:left}
.chk{font-weight:700;font-size:56px;line-height:1.4;background:rgba(0,0,0,.28);border-left:12px solid #ffd23f;padding:24px 34px;border-radius:18px;text-align:left;margin:12px 0;width:100%}
.chk.red{border-left-color:#e63b2e}
/* landscape step layout */
.row{display:flex;align-items:center;gap:80px;width:100%;text-align:left}
.row .num{text-align:center;margin:0;min-width:260px;flex:0 0 260px;width:260px;height:260px;line-height:266px;font-size:170px}
.row .body{flex:1}
.h .label{margin-bottom:18px;font-size:46px}
.h .title{font-size:88px;margin-bottom:34px;line-height:1.4}
.h .desc{font-size:54px}
.h .chk{font-size:56px;padding:18px 30px;margin:9px 0}
.cta-t{font-weight:700;font-size:80px;line-height:1.4;margin-bottom:60px}
.h .cta-t{font-size:74px;margin-bottom:36px}
.card{background:#fff;color:#0a4a2b;border-radius:36px;padding:56px 50px;width:100%}
.h .card{width:auto;padding:36px 80px}
.card .n{font:800 92px Arial,sans-serif;margin:10px 0 6px}
.h .card .n{font-size:80px}
.card .s{font-weight:700;font-size:54px}
.h .card .s{font-size:44px}
.slog{margin-top:60px;font:700 64px Arial,sans-serif;color:#ffd23f;letter-spacing:2px}
.h .slog{margin-top:36px;font-size:54px}
.biglogo{width:300px;height:300px;border-radius:50%;border:8px solid #fff;box-shadow:0 12px 40px rgba(0,0,0,.4);margin-bottom:50px}
.h .ctawrap{display:flex;align-items:center;gap:90px;text-align:left}
.h .ctawrap .biglogo{margin:0;width:340px;height:340px}
.h .ctawrap .col{display:flex;flex-direction:column;align-items:flex-start}
.flag{font-size:150px;margin-bottom:20px}
.a1,.a2,.a3,.a4,.a5,.a6{opacity:0;animation:up .7s cubic-bezier(.2,.8,.2,1) forwards}
.a1{animation-delay:.15s}.a2{animation-delay:.55s}.a3{animation-delay:1.0s}.a4{animation-delay:1.5s}.a5{animation-delay:2.0s}.a6{animation-delay:2.5s}
@keyframes up{from{opacity:0;transform:translateY(70px)}to{opacity:1;transform:none}}
.pop{opacity:0;animation:pop .6s cubic-bezier(.3,1.6,.5,1) .1s forwards}
@keyframes pop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}
.pulse{display:inline-block;animation:pulse 1.6s ease-in-out 1.2s 4}
@keyframes pulse{50%{transform:scale(1.06)}}
</style></head><body>
<div class="bg"></div><div class="grid"></div><div class="plane">✈</div>
<div class="brand"><img class="logo" src="logo.png"><div class="bname">Take Off Int'L (Pvt.)<small>GET VISA SAFELY</small></div></div>
<div class="center" id="c"></div>
<div class="foot">WhatsApp: 01334913153</div>
<script>
const q=new URLSearchParams(location.search);
const o=q.get('o')||'v'; document.body.className=o;
const sc=JSON.parse(decodeURIComponent(q.get('d')));
const a=(i)=>'a'+Math.min(i,6);
let h='';
if(sc.type==='hook'){
  h=(sc.flag?`<div class="flag pop">${sc.flag}</div>`:'')+
    (sc.badge?`<div class="a1"><div class="warn pulse">${sc.badge}</div></div>`:'')+
    `<div class="h1 a2">${sc.html}</div>`+(sc.sub?`<div class="sub a3">${sc.sub}</div>`:'');
}else if(sc.type==='item'){
  let body=`<div class="label a1">${sc.label}</div><div class="title a2">${sc.title}</div>`;
  if(sc.desc) body+=`<div class="desc a3">${sc.desc}</div>`;
  (sc.checks||[]).forEach((c,i)=>body+=`<div class="chk ${sc.red?'red':''} ${a(3+i)}">${c}</div>`);
  h = o==='h' ? `<div class="row"><div class="num pop">${sc.num}</div><div class="body">${body}</div></div>`
              : `<div class="num pop">${sc.num}</div>${body}`;
}else if(sc.type==='cta'){
  const t=`<div class="cta-t a1">${sc.html}</div>`, card=`<div class="card a2"><div class="s">পরামর্শের জন্য WhatsApp করুন</div><div class="n">01334913153</div><div class="s">Take Off International</div></div>`, sl=`<div class="a3"><div class="slog pulse">Get Visa Safely ✈</div></div>`;
  h = o==='h' ? `<div class="ctawrap"><img class="biglogo pop" src="logo.png"><div class="col">${t}${card}${sl}</div></div>`
              : `<img class="biglogo pop" src="logo.png">${t}${card}${sl}`;
  document.querySelector('.foot').style.display='none';
}
document.getElementById('c').innerHTML=h;
</script></body></html>
